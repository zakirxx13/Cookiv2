name: Edge Cache Cookie Check

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  cookie-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Create scraper
        run: |
          cat > scraper.py <<'PY'
          import json
          from pathlib import Path

          import requests

          TARGET_URL = "https://toffeelive.com/en/watch/Xi_Ga5oBNnOkwJLWkhKP"
          COOKIE_NAME = "Edge-Cache-Cookie"
          OUTPUT_FILE = Path("cookie_result.json")

          response = requests.get(
              TARGET_URL,
              timeout=30,
              allow_redirects=True,
              headers={
                  "User-Agent": "Mozilla/5.0"
              },
          )

          found = any(
              cookie.name == COOKIE_NAME
              for cookie in response.cookies
          )

          result = {
              COOKIE_NAME: "[REDACTED]" if found else None
          }

          OUTPUT_FILE.write_text(
              json.dumps(result, indent=2),
              encoding="utf-8",
          )

          print(json.dumps(result, indent=2))
          PY

      - name: Run cookie checker
        run: python scraper.py

      - name: Commit and push result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add cookie_result.json

          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Update cookie detection"
          git push origin HEAD:main
