name: ToffeeLive Network Analysis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toffee-live-network-analysis
  cancel-in-progress: false

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests playwright
          python -m playwright install chromium

      - name: Run Playwright scraper
        run: |
          python zoffee.py

      - name: Commit and push results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          if [ -n "$(git status --porcelain)" ]; then

            # Only commit non-sensitive result files
            git add network_data.json edge_cache_cookie.txt

            if ! git diff --cached --quiet; then
              git commit -m "Update network analysis [$(date +'%Y-%m-%d %H:%M:%S')]"
            fi

            # Get latest remote changes
            git fetch origin main

            # Rebase local commit onto latest main
            git rebase origin/main

            git push origin main

          else
            echo "No changes"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: network-analysis
          path: |
            cookies.json
            network_data.json
            edge_cache_cookie.txt
          if-no-files-found: ignore
